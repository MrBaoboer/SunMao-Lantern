# 两条并行的作业，分工明确。
#
# `toolchain` —— lint、单元断言、几何验算、构建、体积门槛。全部是纯 Node 的活，
#   Node 版本换一档确实会换一套行为（ESLint 10、rolldown、node:test），
#   所以这一条按 engines 声明的两头各跑一遍：`^22.13.0 || >=24.0.0`。
#   声明支持就得有人替它证明。这一条一两分钟就完。
#
# `e2e` —— 无头浏览器走完主线与四个模块。**只跑一次。**
#   它验的是页面在真实浏览器里的行为，而浏览器是同一个 Chromium ——
#   把这二十分钟按 Node 版本再跑一遍，多验到的东西约等于零。
#   跑在声明的下限 22.13 上：真要出问题，出在下限的可能性更大。
#
# 两条同时开跑，没有 needs —— 总耗时取两者中长的那一个，不是它们的和。
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一分支上新的提交把旧的跑挤掉，不必为过时的提交排队
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: 工具链 · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # 这一条不进浏览器，playwright 的内核就不必下（省下约 170 MB 与一两分钟）。
      # 只掐这一项，不用 --ignore-scripts —— 那会把别的包的安装脚本一并跳掉
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run check:code

  e2e:
    name: 冒烟 · 真实浏览器
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13'
          cache: npm
      - run: npm ci

      # 浏览器内核单独缓存：一次下载约 170 MB，命中时这一步几秒就过
      - name: 取 Playwright 内核缓存
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # 缓存命中也要跑 install-deps：系统库装在镜像里，不在缓存里
      - run: npx playwright install-deps chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - run: npm run build
      # 走的是 CPU 软件渲染（SwiftShader）。慢，但整条主线确实跑得完 ——
      # 冒烟脚本自己会把高光溢出关掉，理由见 tools/smoke.mjs 里的注释
      - run: npm run smoke -- --shots

      # 挂了才有价值：每一步的截图是唯一能一眼看出「挂在哪一步、
      # 错在画面还是控制台」的材料
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-shots
          path: .shots/smoke/
          retention-days: 7
          if-no-files-found: ignore
