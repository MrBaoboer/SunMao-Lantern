<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14110e" />
<title>榫卯灯笼 · 国风流光</title>
<meta name="description" content="带你零距离感受惊艳千年的中式结构美学 —— 13 根木条、0 颗钉子、0 滴胶水，可完整拆装的榫卯灯笼 3D 分步交互。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314110e'/%3E%3Crect x='7' y='6' width='18' height='3' fill='%23c8a063'/%3E%3Crect x='7' y='23' width='18' height='3' fill='%23c8a063'/%3E%3Crect x='9' y='6' width='3' height='20' fill='%23c8a063'/%3E%3Crect x='20' y='6' width='3' height='20' fill='%23c8a063'/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="stage"></canvas>

  <!-- 加载屏 -->
  <div id="boot">
    <div class="boot-inner">
      <h1 class="title">榫卯灯笼<span class="dot">·</span>国风流光</h1>
      <p class="sub">带你零距离感受惊艳千年的中式结构美学</p>
      <div class="bootbar"><i></i></div>
      <p class="bootmsg">正在为你点亮这盏灯……</p>
    </div>
  </div>

  <!-- 顶部：分段进度条 + 步骤标题 -->
  <header id="topbar" hidden>
    <div id="progress" class="progress"></div>
    <div class="toprow">
      <div id="steptitle" class="steptitle"></div>
      <div class="topright">
        <button id="btn-verify" class="icon-btn" title="几何校验报告">校验</button>
        <button id="btn-inspect" class="icon-btn" title="结构检视器（X）">检视</button>
        <button id="btn-sound" class="icon-btn" title="声音开关">♪</button>
        <button id="btn-cc" class="icon-btn" title="字幕开关">字</button>
      </div>
    </div>
  </header>

  <!-- 左上：已掌握榫型 -->
  <div id="slots" class="slots" hidden></div>

  <!-- 右上：计数器 -->
  <div id="counter" class="counter" hidden></div>

  <!-- 右侧：参数卡 / 对比卡 -->
  <aside id="cards" class="cards" hidden></aside>

  <!-- 中央提示 -->
  <div id="toast" class="toast" hidden></div>

  <!-- 底部：字幕 + 操作提示 + 主按钮 -->
  <footer id="bottom" hidden>
    <div id="hint" class="hint"></div>
    <div id="subtitle" class="subtitle"></div>
    <div class="controls">
      <button id="btn-back" class="ghost-btn">◂ 上一步</button>
      <div id="actions" class="actions"></div>
      <button id="btn-next" class="main-btn">继续 ▸</button>
    </div>
  </footer>

  <!-- 模块层（M1–M5 / 枢纽 / 海报等占满屏的界面） -->
  <div id="overlay" class="overlay" hidden></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
