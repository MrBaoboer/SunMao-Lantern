<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0b09" />
<title>榫卯灯笼 · 国风流光</title>
<meta name="description" content="十三根木条，一颗钉子也不用。亲手做一盏能拆开的中式灯笼。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0b09'/%3E%3Cg fill='%23d3aa63'%3E%3Crect x='6' y='7' width='20' height='2.6'/%3E%3Crect x='6' y='22.4' width='20' height='2.6'/%3E%3Crect x='9' y='5' width='2.6' height='22'/%3E%3Crect x='20.4' y='5' width='2.6' height='22'/%3E%3C/g%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="stage"></canvas>

  <!-- 开场 -->
  <div id="boot">
    <div class="boot-inner">
      <h1 class="boot-title">榫卯灯笼</h1>
      <p class="boot-sub">十三根木条 · 一颗钉子也不用</p>
      <div class="boot-line"><i></i></div>
      <p class="boot-msg">正在为你点亮这盏灯</p>
    </div>
  </div>

  <!-- 顶部：极细进度 + 步骤名 + 单一菜单入口 -->
  <header id="topbar" hidden>
    <div id="progress" class="progress"></div>
    <div class="toprow">
      <div id="steptitle" class="steptitle"></div>
      <button id="btn-menu" class="menu-dot" aria-label="设置">⋯</button>
    </div>
  </header>

  <!-- 按需出现的一张便签 -->
  <aside id="note" class="note" hidden></aside>

  <!-- 中央短提示 -->
  <div id="toast" class="toast" hidden></div>

  <!-- 底部：提示 → 旁白 → 行动 -->
  <footer id="bottom" hidden>
    <div id="hint" class="hint"></div>
    <div id="subtitle" class="subtitle"></div>
    <div class="actions">
      <button id="btn-back" class="back" aria-label="上一步">‹</button>
      <div id="alts" class="alts"></div>
      <button id="btn-next" class="primary">继续</button>
    </div>
  </footer>

  <!-- 模块与面板 -->
  <div id="overlay" class="overlay" hidden></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
