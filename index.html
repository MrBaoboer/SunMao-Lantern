<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4efe3" />
<title>榫卯灯笼 · 国风流光</title>
<meta name="description" content="十三根木条，一颗钉子也不用。在浏览器里亲手做一盏能拆开的中式灯笼。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f4efe3'/%3E%3Cg fill='%239a7328'%3E%3Crect x='6' y='7' width='20' height='2.6'/%3E%3Crect x='6' y='22.4' width='20' height='2.6'/%3E%3Crect x='9' y='5' width='2.6' height='22'/%3E%3Crect x='20.4' y='5' width='2.6' height='22'/%3E%3C/g%3E%3C/svg%3E" />
<script>
  // 主题要在首帧之前定下来，否则会闪一下
  try {
    var t = JSON.parse(localStorage.getItem('sunmao.v3.state') || '{}').theme;
    document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
  } catch (e) { /* 隐私模式：用默认的浅色 */ }
</script>
</head>
<body>
  <canvas id="stage"></canvas>

  <!-- 封面：先是加载页，就绪后化开，露出背后那盏灯 -->
  <div id="cover" class="cover">
    <div class="cover-bg"></div>
    <div class="cover-veil"></div>
    <div class="cover-inner">
      <p class="cover-eyebrow">国风流光</p>
      <h1 class="cover-title">榫卯灯笼</h1>
      <p class="cover-sub">十三根木条 · 一颗钉子也不用</p>
      <div class="cover-rule"><i id="cover-bar"></i></div>
      <p id="cover-msg" class="cover-msg" role="status">正在为你点亮这盏灯</p>
      <noscript><p class="cover-msg bad">这一页需要 JavaScript 才能运行 —— 请在浏览器里允许脚本后刷新。</p></noscript>
      <div id="cover-act" class="cover-act" hidden></div>
    </div>
  </div>

  <!-- 顶部：走到哪了 -->
  <header id="topbar" hidden>
    <nav id="chapters" class="chapters" aria-label="章节"></nav>
    <div class="toprow">
      <div class="where">
        <span id="stepno" class="stepno"></span>
        <h2 id="steptitle" class="steptitle"></h2>
      </div>
      <button id="btn-menu" class="icon-btn" aria-label="更多" aria-haspopup="true" aria-expanded="false"></button>
    </div>
  </header>

  <!-- 两侧翻页 -->
  <button id="nav-prev" class="nav nav-prev" aria-label="上一步" hidden></button>
  <button id="nav-next" class="nav nav-next" aria-label="下一步" hidden></button>

  <!-- 工艺笔记：按需出现，一次只有一张 -->
  <aside id="note" class="note" aria-label="工艺笔记" hidden></aside>
  <button id="note-tab" class="note-tab" aria-label="展开工艺笔记" hidden>笔记</button>

  <!-- 短提示 -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- 底部：在说什么、这一步要做什么 -->
  <footer id="bottom" hidden>
    <div id="cue" class="cue"></div>
    <p id="narration" class="narration" aria-live="polite"></p>
    <div class="actions">
      <div id="alts" class="alts"></div>
      <button id="btn-task" class="btn btn-primary" hidden></button>
    </div>
  </footer>

  <!-- 覆盖层：卷与坞 -->
  <div id="overlay" class="overlay" hidden></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
